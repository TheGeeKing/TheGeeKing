name: Generate streak card

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate streak.svg
        run: |
          mkdir -p dist

          curl -L \
            "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&locale=en&mode=weekly&theme=dracula&hide_border=false&border_radius=5&order=3" \
            -o dist/streak.svg

      - name: Push streak.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: streak-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
