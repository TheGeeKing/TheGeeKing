name: Generate trophy card

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # https://github.com/ryo-ma/github-profile-trophy
    steps:
      - name: Generate trophy.svg
        run: |
          mkdir -p dist

          curl -L \
            "https://github-profile-trophy-unserori.vercel.app/?username=${{ github.repository_owner }}&theme=dracula&title=MultiLanguage,Repositories,Commits,PullRequest,Experience,Issues,Reviews&column=-1&no-frame=true&no-bg=true" \
            -o dist/trophy.svg

      - name: Push trophy.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
